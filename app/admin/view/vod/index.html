<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$Think.lang.admin}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    {include file="public/file_css"}
    <style type="text/css">
        .layui-table-cell{
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .layui-table img{
            max-width:100%
        }
    </style>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset style="display: none;" id="inputSearch" class="table-search-fieldset">
            <legend>{$Think.lang.search_info}</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form id="searchData" lay-filter="searchData" onsubmit="return false;" class="layui-form layui-form-pane">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <div class="layui-input-inline">
                                <input type="text" name="vod_name" placeholder="{:lang('vodName')}" autocomplete="off" class="layui-input">
                            </div>

                            <div class="layui-input-inline">
                                <select name="type_id" layui.formselect>
                                    <option value="">{:lang('DownSelect')}</option>
                                    {volist name="tree" id="item"}
                                    <option value="{$item.id}" >{$item.p|raw}{$item.name}</option>
                                    {/volist}
                                </select>
                            </div>
                            <div class="layui-input-inline">
                                <select name="vod_status" layui.formselect>
                                    <option value="">{:lang('DownSelect')}</option>
                                    {foreach $status as $key=>$vo }
                                    <option value="{$key}" >{$vo}</option>
                                    {/foreach}
                                </select>
                            </div>
                        </div>

                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" id="doSearch" lay-submit lay-filter="doSearch""><i class="layui-icon"></i>
                            {$Think.lang.search}</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <!--头部工具栏-->
        <div id="toolbarDemo" style="display: none;background: #fff;">
            <span id="FieldUrl" alt="{:url('updateField')}" style="display: none"></span>
            <span id="SwitchUrl" alt="{:url('switchAt')}" style="display: none"></span>
            <span id="AddUrl" alt="{:url('add')}" style="display: none"></span>
            <span id="FieldName" alt="vod_id" style="display: none"></span>
            <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="adds"> {$Think.lang.add} </button>
            <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete"> {$Think.lang.batchDel} </button>
        </div>
        <!--数据-->
        <table class="layui-hide" id="DataDemos" lay-filter="DataDemos"></table>
        <!--操作-->
        <script type="text/html" id="toolBar">
            <span id="DelUrl" alt="{:url('delAll')}" style="display: none"></span>
            <span id="ActionUrl" alt="{:url('edit')}" style="display: none"></span>
            <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edits">{$Think.lang.edit}</a>
            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">{$Think.lang.del}</a>
        </script>

    </div>
</div>
{include file="public/file_js"}
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#DataDemos',
            url: '{:url("dataList")}',
            toolbar: '#toolbarDemo',
            method: 'get',
            page: true,  //开启分页
            limit: 10,  //默认10条
            height: '550', // 最大高度减去其他容器已占有的高度差
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '{$Think.lang.search}',
                layEvent: 'laySearch',
                icon: 'layui-icon layui-icon-search'
            }],
            cols: [[
                {type: "checkbox", width: 50},
                {field: 'vod_id', align:"center", width: 80, title: 'ID', sort: true},
                {field: 'vod_name', align:'left',title: '{:lang("vodName")}',templet:function(d){
                    let res = '';
                    if(d.vod_remarks !== ''){
                        res += d.vod_name + ' <span class="layui-badge layui-bg-orange">'+d.vod_remarks+'</span>';
                    }
                    if(d.vod_isend == 0 && d.vod_serial != ''){
                        res += ' <span class="layui-badge layui-bg-blue">'+"{:lang('serialize')}"+d.vod_serial+'</span>';
                    }
                    return res;
                    }},
                {field: 'nickname', align: 'center',width:100,title: '{$Think.lang.category}'},
                {field: 'vod_pic', align: 'center',width:80,title: '{$Think.lang.articleImg}',templet:function (d) {
                        if(d.vod_pic){
                            return '<img id="imgAmplify" title="'+d.vod_name+'" layer-src="'+d.vod_pic+'" src="'+d.vod_pic+'"/>';
                        }else{
                            return '';
                        }
                    }},
                {field: 'orderSort', align: 'center',width:80,edit:true,title: '{$Think.lang.orderSort}'},
                {field: 'vod_hits', align: 'center',width:80,title: '{$Think.lang.vod_hits}'},
                {field: 'vod_level', align: 'center',width:60,edit:true,title: '{$Think.lang.vod_level}'},
                {field: 'vod_play_from', width:100,align: 'center',title: '{$Think.lang.player}',templet:function(d){
                    return d.vod_play_from.replace(/\$\$\$/g, ',');
                    }},
                {field: 'vod_time',width:170, align: 'center',title: '{$Think.lang.createTime}'},
                {
                    field: 'vod_status', width: 120, align: 'center', templet: function (d) {
                        if (d.vod_status == 1) {
                            return '<input type="checkbox" name="vod_status" value="'+d.vod_id+'" lay-skin="switch" lay-filter="switchTest" lay-text="{:lang("Audited")}|{:lang("Pending_approval")}" checked> ';
                        } else {
                            return '<input type="checkbox" name="vod_status" value="'+d.vod_id+'" lay-skin="switch" lay-filter="switchTest" lay-text="{:lang("Audited")}|{:lang("Pending_approval")}"> ';
                        }
                    }, title: '{$Think.lang.status}'
                },
                {fixed:'right',title: '{$Think.lang.operate}', width: 120, toolbar: '#toolBar', align: "center"}
            ]],
        });
    });
</script>

</body>
</html>
