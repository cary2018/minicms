<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$Think.lang.admin}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    {include file="public/file_css"}
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form ">
    <form class="layui-form" id="DataForm" lay-filter="DataForm" method="post" onsubmit="return false">
        <div class="layui-tab">
            <div class="layui-tab-item layui-show layuimini-form">
                <input type="text" name="from" value="{$data.from}" style="display: none;">
                <div class="layui-form-item">
                    <label class="layui-form-label required">{:lang('collect_name')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="show" lay-verify="required" lay-reqtext="{$Think.lang.TitleNotEmpty}" value="{$data.show}" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label required">{:lang('vodCode')}</label>
                    <div class="layui-input-inline">
                        <input type="text" name="from" readonly disabled value="{$data.from}" lay-verify="required" lay-reqtext="{$Think.lang.TitleNotEmpty}" class="layui-input">
                    </div>
                    <label class="layui-lable">{:lang('OrderSort')}</label>
                    <div class="layui-input-inline">
                        <input type="text" name="sort" value="{$data.sort}" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('status')}</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="status" value="1" title="{$Think.lang.Enable}" {if $data.status == 1}checked{/if} >
                        <input type="radio" name="status" value="0" title="{$Think.lang.Disable}" {if $data.status == 0}checked{/if}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('codeStatus')}</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="ps" value="1" title="{$Think.lang.Enable}" {if $data.ps == 1}checked{/if}>
                        <input type="radio" name="ps" value="0" title="{$Think.lang.Disable}" {if $data.ps == 0}checked{/if} >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('interAddr')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="parse" value="{$data.parse}" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('Remark')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="des" value="{$data.des}" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('playTip')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="tip" value="{$data.tip}" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="doSubmit">{$Think.lang.Save}</button>
            </div>
        </div>
    </form>

</div>
{include file="public/file_js"}
</body>
</html>
