<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$Think.lang.admin}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    {include file="public/file_css"}
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form ">
    <form class="layui-form" id="DataForm" lay-filter="DataForm" method="post" onsubmit="return false">
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show layuimini-form">

                <div class="layui-form-item">
                    <label class="layui-form-label required">{:lang('collect_name')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="show" lay-verify="required" lay-reqtext="{$Think.lang.TitleNotEmpty}" value="" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label required">{:lang('vodCode')}</label>
                    <div class="layui-input-inline">
                        <input type="text" name="from" value="" lay-verify="required" lay-reqtext="{$Think.lang.TitleNotEmpty}" class="layui-input">
                    </div>
                    <label class="layui-lable">{:lang('OrderSort')}</label>
                    <div class="layui-input-inline">
                        <input type="text" name="sort" value="100" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('status')}</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="status" value="1" title="{$Think.lang.Enable}" checked >
                        <input type="radio" name="status" value="0" title="{$Think.lang.Disable}" >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('codeStatus')}</label>
                    <div class="layui-input-inline">
                        <input type="radio" name="ps" value="1" title="{$Think.lang.Enable}" >
                        <input type="radio" name="ps" value="0" title="{$Think.lang.Disable}" checked >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('interAddr')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="parse" value="" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('Remark')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="des" value="" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">{:lang('playTip')}</label>
                    <div class="layui-input-block">
                        <input type="text" name="tip" value="" class="layui-input">
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="doSubmit">{$Think.lang.Save}</button>
            </div>
        </div>
    </form>

</div>
{include file="public/file_js"}
</body>
</html>
