<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{$Think.lang.admin}</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    {include file="public/file_css"}
    <style type="text/css">
        .layui-table-cell{
            text-align:center;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .layui-table img{
            max-width:100%
        }
    </style>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <fieldset style="display: none;" id="inputSearch" class="table-search-fieldset">
            <legend>{$Think.lang.search_info}</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form id="searchData" lay-filter="searchData" onsubmit="return false;" class="layui-form layui-form-pane">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <div class="layui-input-inline">
                                <input type="text" name="title" placeholder="{$Think.lang.variable_title}" autocomplete="off" class="layui-input">
                            </div>

                        </div>

                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" id="doSearch" lay-submit lay-filter="doSearch""><i class="layui-icon"></i>
                            {$Think.lang.search}</button>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>

        <!--头部工具栏-->
        <div id="toolbarDemo" style="display: none;background: #fff;">
            <span id="FieldUrl" alt="{:url('updateField')}" style="display: none"></span>
            <span id="SwitchUrl" alt="{:url('switchAt')}" style="display: none"></span>
            <span id="AddUrl" alt="{:url('add')}" style="display: none"></span>
            <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="adds"> {$Think.lang.add} </button>
            <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete"> {$Think.lang.batchDel} </button>
        </div>
        <!--数据-->
        <table class="layui-hide" id="DataDemos" lay-filter="DataDemos"></table>

        <!--采集选项-->
        <script type="text/html" id="collect_select">

            <a class="layui-btn  layui-btn-radius layui-btn-xs layui-bg-blue" lay-event="JumpPage" title="{:lang('collect_bind')}" action="{:url('bindType')}?{{d.jump}}">{:lang('collect_bind')}</a>
            <a class="layui-btn  layui-btn-radius layui-btn-xs layui-bg-blue" lay-event="timing" title="{{d.collect_name}}" data-url="{:url('timing')}?{{d.today}}" action="{:url('timing')}?{{d.week}}">{$Think.lang.collect_time}</a>
            <a class="layui-btn  layui-btn-radius layui-btn-xs layui-bg-blue" lay-event="JumpPage" title="{:lang('collect_today')}{{d.collect_name}}" action="{:url(\'collectData\')}?{{d.today}}">{$Think.lang.collect_today}</a>
            <a class="layui-btn  layui-btn-radius layui-btn-xs layui-bg-blue" lay-event="JumpPage" title="{:lang('collect_week')}{{d.collect_name}}" action={:url(\'collectData\')}?{{d.week}}>{$Think.lang.collect_week}</a>
            <a class="layui-btn  layui-btn-radius layui-btn-xs layui-bg-blue" lay-event="collect" title="{:lang('collect_all')}{{d.collect_name}}" action={:url(\'collectData\')}?{{d.cjAll}}>{$Think.lang.collect_all}</a>

        </script>
        <!--操作-->
        <script type="text/html" id="toolBar">
            <span id="DelUrl" alt="{:url('delAll')}" style="display: none"></span>
            <span id="ActionUrl" alt="{:url('edit')}" style="display: none"></span>
            <span id="FieldName" alt="collect_id" style="display: none"></span>
            <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edits">{$Think.lang.edit}</a>
            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">{$Think.lang.del}</a>
        </script>

    </div>
</div>
{include file="public/file_js"}
<script>
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        table.render({
            elem: '#DataDemos',
            url: '{:url("dataList")}',
            toolbar: '#toolbarDemo',
            method: 'get',
            page: true,  //开启分页
            limit: 10,  //默认10条
            height: '550', // 最大高度减去其他容器已占有的高度差
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '{$Think.lang.search}',
                layEvent: 'laySearch',
                icon: 'layui-icon layui-icon-search'
            }],
            cols: [[
                {type: "checkbox", width: 50},
                {field: 'collect_id', align:"center", width: 80, title: 'ID', sort: true},
                {field: 'collect_name', align: 'center',width:150,title: '{$Think.lang.collect_name}',templet:function(d){
                        return '<a action="{:url(\'api\')}?'+d.jump+'&name='+d.collect_name+'" title="'+d.collect_name+'" lay-event="JumpPage">'+d.collect_name+'</a>'
                    }},
                {field: 'collect_type', align: 'center',width:100,title: '{$Think.lang.collect_type}'},
                {field: 'collect_mid', align: 'center',width:100,title: '{$Think.lang.collect_mid}'},
                {field: 'collect_web', align: 'center',width:100,title: '{$Think.lang.collect_web_zy}',templet:function(d){
                        return '<a href="'+d.collect_web+'" title="'+d.collect_web+'" target="_blank">{:lang("collect_web")}</a>'
                    }},
                {field: 'views', align: 'center',title: '{$Think.lang.collect_select}',toolbar:"#collect_select"},
                /*{field: 'createTime', align: 'center',title: '{$Think.lang.createTime}'},*/
                {fixed:'right',title: '{$Think.lang.operate}', width: 120, toolbar: '#toolBar', align: "center"}
            ]],
        });
    });
</script>

</body>
</html>
