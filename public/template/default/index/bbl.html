<!DOCTYPE html>
<html>
<head>
    <title>萤火虫背景特效</title>

    <style>
        /* styles.css */

        /* 设置页面背景为黑色，模拟夜晚 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* 黑色背景 */
            overflow: hidden; /* 隐藏滚动条 */
        }

        /* 萤火虫容器样式 */
        .firefly-container {
            position: relative;
            width: 100%;
            height: 100vh; /* 全屏高度 */
        }

        /* 萤火虫光点基本样式 */
        .firefly {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8); /* 半透明白色 */
            border-radius: 50%; /* 圆形 */
            opacity: 0.8;
            animation: fly 10s linear infinite, blink 2s infinite;
        }

        /* 生成不同颜色和大小 */
        .firefly:nth-child(1) {
            background-color: rgba(255, 255, 0, 0.8); /* 黄色 */
            width: 8px;
            height: 8px;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .firefly:nth-child(2) {
            background-color: rgba(0, 255, 0, 0.8); /* 绿色 */
            width: 12px;
            height: 12px;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .firefly:nth-child(3) {
            background-color: rgba(0, 0, 255, 0.8); /* 蓝色 */
            width: 10px;
            height: 10px;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .firefly:nth-child(4) {
            background-color: rgba(255, 0, 0, 0.8); /* 红色 */
            width: 9px;
            height: 9px;
            animation-duration: 9s;
            animation-delay: 6s;
        }

        .firefly:nth-child(5) {
            background-color: rgba(255, 255, 255, 0.8); /* 白色 */
            width: 11px;
            height: 11px;
            animation-duration: 11s;
            animation-delay: 8s;
        }

        /* 其他萤火虫光点的样式 */
        .firefly:nth-child(6) {
            background-color: rgba(255, 165, 0, 0.8); /* 橙色 */
            width: 10px;
            height: 10px;
            animation-duration: 10s;
            animation-delay: 10s;
        }

        .firefly:nth-child(7) {
            background-color: rgba(75, 0, 130, 0.8); /* 紫色 */
            width: 12px;
            height: 12px;
            animation-duration: 12s;
            animation-delay: 12s;
        }

        .firefly:nth-child(8) {
            background-color: rgba(255, 192, 203, 0.8); /* 粉色 */
            width: 9px;
            height: 9px;
            animation-duration: 9s;
            animation-delay: 14s;
        }

        .firefly:nth-child(9) {
            background-color: rgba(0, 255, 255, 0.8); /* 青色 */
            width: 11px;
            height: 11px;
            animation-duration: 11s;
            animation-delay: 16s;
        }

        .firefly:nth-child(10) {
            background-color: rgba(255, 0, 255, 0.8); /* 品红色 */
            width: 10px;
            height: 10px;
            animation-duration: 10s;
            animation-delay: 18s;
        }

        /* 飞行动画 */
        @keyframes fly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(100px, 100px) scale(1.5);
                opacity: 0.5;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
        }

        /* 闪烁动画 */
        @keyframes blink {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 0.3;
            }
        }
            </style>
</head>
<body>
<div class="firefly-container">
    <!-- 萤火虫光点将由JavaScript动态生成 -->
</div>


<script>
    // script.js

    // 获取容器元素
    const container = document.querySelector('.firefly-container');

    // 生成萤火虫光点的数量
    const numberOfFireflies = 50;

    // 定义颜色数组
    const colors = ['rgba(255, 255, 0, 0.8)', 'rgba(0, 255, 0, 0,8)', 'rgba(0, 0, 255, 0.8)', 'rgba(255, 0, 0, 0.8)', 'rgba(255, 255, 255, 0.8)', 'rgba(255, 165, 0, 0.8)', 'rgba(75, 0, 130, 0.8)', 'rgba(255, 192, 203, 0.8)', 'rgba(0, 255, 255, 0.8)', 'rgba(255, 0, 255, 0.8)'];

    // 定义动画持续时间数组
    const animationDurations = [8, 10, 12, 9, 11, 10, 12, 9, 11, 10];

    // 动态生成萤火虫光点
    for (let i = 0; i < numberOfFireflies; i++) {
        const firefly = document.createElement('div');
        firefly.classList.add('firefly');

        // 随机设置颜色
        const colorIndex = Math.floor(Math.random() * colors.length);
        firefly.style.backgroundColor = colors[colorIndex];

        // 随机设置大小
        const size = Math.floor(Math.random() * 5) + 5; // 5px 到 10px
        firefly.style.width = `${size}px`;
        firefly.style.height = `${size}px`;

        // 随机设置位置
        const x = Math.floor(Math.random() * window.innerWidth);
        const y = Math.floor(Math.random() * window.innerHeight);
        firefly.style.left = `${x}px`;
        firefly.style.top = `${y}px`;

        // 随机设置动画持续时间
        const duration = animationDurations[Math.floor(Math.random() * animationDurations.length)];
        firefly.style.animationDuration = `${duration}s`;

        // 随机设置动画延迟
        const delay = Math.floor(Math.random() * 10);
        firefly.style.animationDelay = `${delay}s`;

        // 添加到容器中
        container.appendChild(firefly);
    }

    // 监听窗口大小变化，动态调整萤火虫光点的位置
    window.addEventListener('resize', () => {
        const fireflies = document.querySelectorAll('.firefly');
        fireflies.forEach(firefly => {
            const x = Math.floor(Math.random() * window.innerWidth);
            const y = Math.floor(Math.random() * window.innerHeight);
            firefly.style.left = `${x}px`;
            firefly.style.top = `${y}px`;
        });
    });
</script>
</body>
</html>
